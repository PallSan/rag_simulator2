<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Realistic RAG Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: system-ui, -apple-system;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
}

.card {
    background: #1e293b;
    padding: 16px;
    border-radius: 12px;
    margin: 12px 0;
}

.title {
    color: #38bdf8;
    font-weight: bold;
    margin-bottom: 8px;
}

textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

button {
    margin-top: 10px;
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #3b82f6, #9333ea);
    color: white;
    cursor: pointer;
}

pre {
    background: #020617;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
}

.doc {
    background: #334155;
    padding: 8px;
    border-radius: 8px;
    margin: 6px 0;
}

.score {
    color: #22c55e;
    font-size: 12px;
}

.highlight {
    color: #22c55e;
}
</style>
</head>

<body>

<div class="container">
<h1>🧠 Real RAG Simulator</h1>

<div class="card">
<div class="title">1. Query</div>
<textarea id="query" rows="3" placeholder="Ask something like: What is RAG?"></textarea>
<button onclick="runRAG()">Run RAG</button>
</div>

<div class="card">
<div class="title">2. Query Embedding (TF-IDF Vector)</div>
<pre id="queryVec"></pre>
</div>

<div class="card">
<div class="title">3. Retrieved Documents (Top-K)</div>
<div id="results"></div>
</div>

<div class="card">
<div class="title">4. Augmented Prompt</div>
<pre id="prompt"></pre>
</div>

<div class="card">
<div class="title">5. Generated Response (Grounded)</div>
<div id="response"></div>
</div>

</div>

<script>

// ===== Corpus =====
const docs = [
"RAG stands for Retrieval Augmented Generation.",
"RAG improves language models by adding external knowledge.",
"Embeddings represent text as numerical vectors.",
"Vector databases store embeddings and enable similarity search.",
"Cosine similarity measures closeness between vectors.",
"RAG reduces hallucinations by grounding responses in real data.",
"Large language models generate responses based on input context.",
"TF-IDF is a method to convert text into vectors.",
];

// ===== Preprocessing =====
function tokenize(text) {
    return text.toLowerCase().replace(/[^\w\s]/g, "").split(/\s+/);
}

// Build vocabulary
const vocab = [...new Set(docs.flatMap(d => tokenize(d)))];

// Compute IDF
function computeIDF() {
    let idf = {};
    vocab.forEach(term => {
        let count = docs.filter(d => tokenize(d).includes(term)).length;
        idf[term] = Math.log((docs.length + 1) / (count + 1));
    });
    return idf;
}

const IDF = computeIDF();

// TF-IDF vector
function vectorize(text) {
    let tokens = tokenize(text);
    let vec = {};

    vocab.forEach(term => {
        let tf = tokens.filter(t => t === term).length;
        vec[term] = tf * IDF[term];
    });

    return vec;
}

// Cosine similarity
function cosineSim(a, b) {
    let dot = 0, magA = 0, magB = 0;

    vocab.forEach(term => {
        dot += (a[term] || 0) * (b[term] || 0);
        magA += (a[term] || 0) ** 2;
        magB += (b[term] || 0) ** 2;
    });

    return dot / (Math.sqrt(magA) * Math.sqrt(magB) + 1e-9);
}

// Precompute doc vectors
const docVectors = docs.map(d => vectorize(d));

// ===== RAG Pipeline =====
function runRAG() {

    let query = document.getElementById("query").value;
    if (!query) return alert("Enter query");

    let qVec = vectorize(query);

    // Show vector (trim zeros)
    let compactVec = Object.entries(qVec)
        .filter(([k,v]) => v > 0)
        .slice(0,10);

    document.getElementById("queryVec").innerText =
        JSON.stringify(compactVec, null, 2);

    // Retrieval
    let scored = docs.map((doc, i) => ({
        doc,
        score: cosineSim(qVec, docVectors[i])
    }));

    scored.sort((a,b) => b.score - a.score);

    let topK = scored.slice(0, 3);

    document.getElementById("results").innerHTML =
        topK.map(d =>
            `<div class="doc">${d.doc}<br><span class="score">score: ${d.score.toFixed(3)}</span></div>`
        ).join("");

    // Augmented prompt
    let prompt = `
SYSTEM: Answer ONLY using the provided context.

CONTEXT:
${topK.map(d => "- " + d.doc).join("\n")}

USER QUESTION:
${query}
`;

    document.getElementById("prompt").innerText = prompt;

    // "LLM" (rule-based grounding)
    let response = generateAnswer(query, topK.map(d => d.doc));

    document.getElementById("response").innerHTML =
        `<span class="highlight">${response}</span>`;
}

// ===== Fake grounded generator =====
function generateAnswer(query, contextDocs) {

    let combined = contextDocs.join(" ").toLowerCase();

    if (combined.includes("rag")) {
        return "RAG is a technique where retrieved documents are used to improve the response generation of a language model.";
    }

    if (combined.includes("embedding")) {
        return "Embeddings are numerical vector representations of text used for similarity search.";
    }

    if (combined.includes("cosine")) {
        return "Cosine similarity measures how similar two vectors are in a vector space.";
    }

    return "Answer derived strictly from retrieved context: " + contextDocs[0];
}

</script>

</body>
</html>
